<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#0066cc">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="apple-mobile-web-app-title" content="RPM Meter">
    <meta name="description" content="Drehzahlmessung für Boots-Dieselmotoren via Akustik-Analyse">
    <link rel="manifest" href="manifest.json">
    <link rel="apple-touch-icon" href="icons/icon-192.png">
    <link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
    <link rel="stylesheet" href="css/style.css">
    <title>Marine Diesel RPM Meter</title>
</head>
<body>
    <header class="app-header">
        <h1 class="app-title">
            <svg class="app-icon" viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2">
                <circle cx="12" cy="12" r="10"/>
                <polyline points="12 6 12 12 16 14"/>
            </svg>
            RPM Meter
        </h1>
        <a href="video.html" style="display:flex;align-items:center;gap:4px;color:#0066cc;text-decoration:none;font-size:14px;font-weight:500;padding:6px 12px;border-radius:8px;" title="Video RPM Analyzer">
            <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="23 7 16 12 23 17 23 7"/><rect x="1" y="5" width="15" height="14" rx="2" ry="2"/></svg>
            Video
        </a>
    </header>

    <main class="app-main">
        <!-- Gauge Section -->
        <section class="gauge-section">
            <div class="gauge-container" id="gaugeContainer">
                <canvas id="gaugeCanvas"></canvas>
            </div>
            <div class="rpm-digital" id="rpmDigital">
                <span class="rpm-value" id="rpmValue">0</span>
                <span class="rpm-unit">RPM</span>
            </div>
            <div class="status-bar">
                <span class="status-indicator" id="statusIndicator">
                    <span class="status-dot" id="statusDot"></span>
                    <span id="statusText">Bereit</span>
                </span>
                <span class="detected-freq" id="detectedFreq">— Hz</span>
            </div>
        </section>

        <!-- Controls Section -->
        <section class="controls-section">
            <!-- Source Selection -->
            <div class="control-group">
                <label class="control-label">Quelle</label>
                <div class="toggle-group" id="sourceToggle">
                    <button class="toggle-btn active" data-source="file" id="btnSourceFile">
                        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/>
                            <polyline points="14 2 14 8 20 8"/>
                        </svg>
                        Datei
                    </button>
                    <button class="toggle-btn" data-source="mic" id="btnSourceMic">
                        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"/>
                            <path d="M19 10v2a7 7 0 0 1-14 0v-2"/>
                            <line x1="12" y1="19" x2="12" y2="23"/>
                            <line x1="8" y1="23" x2="16" y2="23"/>
                        </svg>
                        Mikrofon
                    </button>
                </div>
            </div>

            <!-- File Input (shown when source=file) -->
            <div class="control-group" id="fileInputGroup">
                <label class="control-label" for="audioFile">Audiodatei</label>
                <div class="file-input-wrapper">
                    <input type="file" id="audioFile" accept="audio/*,video/*,.wav,.WAV,.mp3,.MP3,.m4a,.M4A,.ogg,.OGG,.aac,.AAC,.flac,.FLAC,.mp4,.MP4,.mov,.MOV" class="file-input">
                    <label for="audioFile" class="file-input-label" id="fileLabel">
                        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
                            <polyline points="17 8 12 3 7 8"/>
                            <line x1="12" y1="3" x2="12" y2="15"/>
                        </svg>
                        Datei wählen…
                    </label>
                </div>
                <!-- Playback progress bar -->
                <div class="progress-bar-container" id="progressBarContainer" style="display: none;">
                    <div class="progress-bar" id="progressBar"></div>
                    <div class="progress-time">
                        <span id="currentTime">0:00</span>
                        <span id="totalTime">0:00</span>
                    </div>
                </div>
            </div>

            <!-- Cylinder Selection -->
            <div class="control-group">
                <label class="control-label">Zylinder</label>
                <div class="cylinder-group" id="cylinderGroup">
                    <button class="cyl-btn" data-cyl="1">1</button>
                    <button class="cyl-btn" data-cyl="2">2</button>
                    <button class="cyl-btn" data-cyl="3">3</button>
                    <button class="cyl-btn active" data-cyl="4">4</button>
                    <button class="cyl-btn" data-cyl="5">5</button>
                    <button class="cyl-btn" data-cyl="6">6</button>
                </div>
            </div>

            <!-- RPM Range Selection -->
            <div class="control-group">
                <label class="control-label">Drehzahlbereich</label>
                <div class="range-group" id="rangeGroup">
                    <button class="range-btn active" data-range="idle" title="Leerlauf / Standgas (400–800 RPM)">
                        Standgas<small>400–800</small>
                    </button>
                    <button class="range-btn" data-range="cruise" title="Marschfahrt / Normal (800–2.000 RPM)">
                        Fahrt<small>800–2000</small>
                    </button>
                    <button class="range-btn" data-range="high" title="Volllast / High (1.800–3.500 RPM)">
                        Volllast<small>1800–3500</small>
                    </button>
                    <button class="range-btn" data-range="auto" title="Automatischer Bereich (400–3.500 RPM)">
                        Auto<small>400–3500</small>
                    </button>
                </div>
            </div>

            <!-- Spectrum Toggle -->
            <div class="control-group">
                <label class="control-label">Ansicht</label>
                <div class="toggle-group">
                    <button class="toggle-btn" id="btnToggleSpectrum">
                        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2">
                            <polyline points="22 12 18 12 15 21 9 3 6 12 2 12"/>
                        </svg>
                        Frequenzspektrum
                    </button>
                    <button class="toggle-btn" id="btnToggleHistory">
                        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2">
                            <polyline points="23 6 13.5 15.5 8.5 10.5 1 18"/>
                            <polyline points="17 6 23 6 23 12"/>
                        </svg>
                        RPM-Verlauf
                    </button>
                </div>
            </div>
        </section>

        <!-- Spectrum Section (hidden by default) -->
        <section class="spectrum-section" id="spectrumSection" style="display: none;">
            <div class="section-header">
                <h2 class="section-title">Frequenzspektrum</h2>
            </div>
            <div class="spectrum-container">
                <canvas id="spectrumCanvas"></canvas>
            </div>
        </section>

        <!-- History / Timeline Section (hidden by default) -->
        <section class="history-section" id="historySection" style="display: none;">
            <div class="section-header">
                <h2 class="section-title">RPM-Verlauf</h2>
                <button class="btn-icon" id="btnExportCSV" title="Als CSV exportieren">
                    <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
                        <polyline points="7 10 12 15 17 10"/>
                        <line x1="12" y1="15" x2="12" y2="3"/>
                    </svg>
                </button>
            </div>
            
            <div class="history-container">
                <canvas id="historyCanvas"></canvas>
            </div>

            <div id="statsContainer" style="margin-top: 20px; background: #fff; padding: 15px; border-radius: 12px; border: 1px solid #e5e5ea;">
                <h3 style="margin-top: 0; font-size: 16px;">Auswertung</h3>
                <p style="font-size: 14px; color: #333;"><strong>Durchschnitt (Gesamt):</strong> <span id="avgRpmDisplay">-</span> RPM</p>
                <h4 style="margin-top: 15px; margin-bottom: 8px; font-size: 14px; color: #666;">Verlauf (sekündlich)</h4>
                <div id="secRpmList" style="max-height: 200px; overflow-y: auto; font-size: 13px; font-family: monospace; color: #555; background: #f9f9f9; padding: 10px; border-radius: 6px; border: 1px solid #eee;">
                    Keine Daten vorhanden.
                </div>
            </div>
        </section>

        <!-- Action Button -->
        <section class="action-section">
            <button class="btn-primary" id="btnStart">
                <svg viewBox="0 0 24 24" width="22" height="22" fill="currentColor" stroke="none">
                    <polygon points="5 3 19 12 5 21 5 3"/>
                </svg>
                Starten
            </button>
            <button class="btn-secondary" id="btnStop" style="display: none;">
                <svg viewBox="0 0 24 24" width="22" height="22" fill="currentColor" stroke="none">
                    <rect x="6" y="4" width="4" height="16"/>
                    <rect x="14" y="4" width="4" height="16"/>
                </svg>
                Stoppen
            </button>
        </section>
    </main>

    <footer class="app-footer">
        <p>100 % lokale Verarbeitung · Keine Daten werden übertragen</p>
    </footer>

    <script type="module" src="js/app.js"></script>
</body>
</html>
